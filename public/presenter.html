<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodFlow - プレゼンター</title>
    <script src="/checkAuth.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 840px;
            margin-top: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        h1 {
            margin-bottom: 20px;
            text-align: center;
            color: #667eea;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="text"] {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            width: 220px;
            font-size: 1rem;
        }

        button {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-start {
            background: #4CAF50;
            color: white;
        }

        .btn-stop {
            background: #f44336;
            color: white;
        }

        .btn-secondary {
            background: #667eea;
            color: white;
        }

        .btn-start:disabled,
        .btn-stop:disabled {
            background: #e0e0e0;
            color: #888;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin: 10px 0;
            font-weight: bold;
            height: 1.2em;
            color: #666;
        }

        #transcriptLog {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            line-height: 1.5;
            border: 1px solid #e2e8f0;
            margin-top: 20px;
        }

        .transcript-item {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #e0e0e0;
        }

        .time {
            color: #888;
            font-size: 0.8em;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div style="margin-bottom: 10px;">
            <a href="admin.html" style="color: #667eea; text-decoration: none; font-size: 1rem;">← 管理画面へ戻る</a>
        </div>
        <h1>🗣️ プレゼンター 音声/メモ送信</h1>

        <div class="card">
            <div class="controls">
                <input type="text" id="sessionId" placeholder="セッションID" value="demo-1">
                <button id="btnStart" class="btn-start" onclick="startRecognition()">録音開始</button>
                <button id="btnStop" class="btn-stop" onclick="stopRecognition()" disabled>停止</button>
            </div>

            <div id="status">待機中</div>

            <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:10px;">
                <input type="text" id="quickNote" placeholder="手動メモを入力 (Enterで送信)" style="flex:1; min-width:220px;">
                <button class="btn-secondary" onclick="sendManualNote()">メモ送信</button>
            </div>

            <div id="transcriptLog">
                <div style="opacity: 0.5; text-align: center; margin-top: 100px;">
                    音声を開始するとここに表示されます...
                </div>
            </div>
        </div>
    </div>

    <script>
        let recognition;
        let isRecognizing = false;
        let sessionId = 'demo-1';

        window.onload = function () {
            const params = new URLSearchParams(window.location.search);
            const urlSessionId = params.get('sessionId');
            if (urlSessionId) {
                document.getElementById('sessionId').value = urlSessionId;
                sessionId = urlSessionId;
            }
            initSpeech();
            document.getElementById('quickNote').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    sendManualNote();
                }
            });
        };

        function initSpeech() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("お使いのブラウザは音声認識に対応していません。Chromeでお試しください。");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.lang = 'ja-JP';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onstart = function () {
                isRecognizing = true;
                setStatus("録音中...", "red");
                toggleButtons(true);
            };

            recognition.onend = function () {
                isRecognizing = false;
                setStatus("停止", "#666");
                toggleButtons(false);
            };

            recognition.onresult = async function (event) {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        const text = event.results[i][0].transcript;
                        addLog("Speaker", text);
                        await sendTranscript(text);
                    }
                }
            };

            recognition.onerror = function (event) {
                console.error("Speech Error", event.error);
                setStatus("エラー: " + event.error, "#e53e3e");
            };
        }

        function toggleButtons(recording) {
            document.getElementById('btnStart').disabled = recording;
            document.getElementById('btnStop').disabled = !recording;
        }

        function setStatus(text, color) {
            const el = document.getElementById('status');
            el.innerText = text;
            el.style.color = color;
        }

        function startRecognition() {
            sessionId = document.getElementById('sessionId').value || 'demo-1';
            if (!recognition) initSpeech();
            if (!isRecognizing) recognition.start();
        }

        function stopRecognition() {
            if (recognition && isRecognizing) recognition.stop();
        }

        function addLog(speaker, text) {
            const log = document.getElementById('transcriptLog');
            if (log.innerHTML.includes('音声を開始するとここに表示されます')) {
                log.innerHTML = '';
            }
            const div = document.createElement('div');
            div.className = 'transcript-item';
            const time = new Date().toLocaleTimeString();
            div.innerHTML = `<span class="time">[${time}]</span> <span>${text}</span>`;
            log.prepend(div);
        }

        async function sendTranscript(text) {
            try {
                const res = await fetch('/api/submit-transcript', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sessionId: sessionId,
                        text: text,
                        speaker: 'Presenter'
                    })
                });
                if (!res.ok) console.error("送信に失敗しました");
            } catch (e) {
                console.error("送信エラー", e);
            }
        }

        async function sendManualNote() {
            const text = document.getElementById('quickNote').value.trim();
            if (!text) return;
            await sendTranscript(text);
            addLog("Note", text);
            document.getElementById('quickNote').value = '';
        }
    </script>
</body>

</html>
