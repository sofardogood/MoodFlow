<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MoodFlow</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 640px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.4rem;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 14px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: white;
      background: rgba(0, 0, 0, 0.35);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: white;
      color: #333;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.18);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.35);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .reaction-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 1.6rem;
    }

    .reaction-buttons {
      display: flex;
      justify-content: center;
      gap: 18px;
      width: 100%;
    }

    .reaction-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      font-size: 3rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .reaction-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.4);
    }

    .comment-trigger {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      text-decoration: underline;
      cursor: pointer;
      padding: 10px;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: fadeIn 0.25s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .animation-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .animating-emoji {
      position: absolute;
      font-size: 4rem;
      transform-origin: center;
      animation: explode 1s ease-out forwards;
      opacity: 0.8;
    }

    @keyframes explode {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }

      100% {
        transform: translate(-50%, -50%) scale(15);
        opacity: 0;
      }
    }

    .participant-label {
      text-align: center;
      padding: 10px;
      font-size: 1rem;
      opacity: 0.9;
      margin-bottom: 10px;
    }

    #statusMessage {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .row .input-group {
      flex: 1;
      min-width: 140px;
    }
  </style>
</head>

<body>
  <div class="animation-layer" id="animationLayer"></div>
  <div id="statusMessage">送信しました</div>

  <div class="container">
    <!-- JOIN SCREEN -->
    <div id="joinScreen" class="screen active">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
        <h1>MoodFlow</h1>
        <p style="text-align: center; margin-bottom: 20px; opacity: 0.9;">会議のムードをリアルタイムで共有</p>

        <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; font-size: 0.9rem;">
          <a href="admin.html" style="color: white; opacity: 0.8; padding: 10px;">🔐 管理画面</a>
        </div>

        <div class="glass-card">
          <div class="input-group">
            <label>セッションID</label>
            <input type="text" id="sessionInput" placeholder="meeting-001">
          </div>
          <div class="input-group">
            <label>ニックネーム</label>
            <input type="text" id="nicknameInput" placeholder="例: ペンギン">
          </div>
          <div class="row">
            <div class="input-group">
              <label>役割</label>
              <select id="roleSelect">
                <option value="">選択なし</option>
                <option value="participant">参加者</option>
                <option value="facilitator">ファシリ</option>
                <option value="executive">経営層</option>
              </select>
            </div>
            <div class="input-group">
              <label>部署/チーム</label>
              <input type="text" id="deptInput" placeholder="例: 開発部">
            </div>
          </div>
          <div class="row">
            <div class="input-group">
              <label>あなたの言語</label>
              <select id="languageSelect">
                <option value="ja">日本語</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="input-group">
              <label>レポート言語</label>
              <select id="targetLanguageSelect">
                <option value="ja">日本語</option>
                <option value="en">English</option>
              </select>
            </div>
          </div>
          <div class="row">
            <button class="btn btn-secondary" style="flex:1;" onclick="openQRModal()">QRを表示</button>
            <button class="btn btn-primary" style="flex:2;" onclick="joinSession()">参加する</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen" class="screen">
      <div class="participant-label">
        <span id="displayNickname">ゲスト</span> として参加中
        <button onclick="leaveSession()"
          style="margin-left: 10px; padding: 5px 10px; background: rgba(255,255,255,0.2); border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 0.8rem;">退出</button>
      </div>

      <div class="reaction-zone">
        <h2 style="font-weight: 300; opacity: 0.9;">今の気持ちは？</h2>
        <div class="reaction-buttons">
          <button class="reaction-btn" onclick="handleReaction(event, '😢', -5)">😢</button>
          <button class="reaction-btn" onclick="handleReaction(event, '🙂', 0)">🙂</button>
          <button class="reaction-btn" onclick="handleReaction(event, '😄', 5)">😄</button>
        </div>
        <div class="comment-trigger" onclick="openCommentModal()">💬 コメントを書く</div>
      </div>

      <div class="glass-card" style="margin-top: 10px;">
        <h3 style="margin-bottom: 8px;">📝 発言メモ・議事メモ</h3>
        <textarea id="noteInput" rows="3" placeholder="重要な発言や決定事項をメモ (全員匿名で保存)"></textarea>
        <button class="btn btn-secondary" style="margin-top: 10px;" onclick="submitNote()">メモを送信</button>
      </div>

      <div class="glass-card" style="margin-top: 10px;">
        <h3 style="margin-bottom: 8px;">❓ 質問キュー（匿名）</h3>
        <textarea id="questionInput" rows="2" placeholder="聞きたいことやリクエストを送信"></textarea>
        <div style="display:flex; gap:10px; margin-top:10px; flex-wrap:wrap;">
          <button class="btn btn-secondary" style="flex:1" onclick="submitQuestion()">質問を送信</button>
          <button class="btn btn-secondary" style="flex:1" onclick="refreshQuestions()">最新の質問を表示</button>
        </div>
        <ul id="questionList" style="margin-top:10px; padding-left:18px; line-height:1.5; max-height:160px; overflow-y:auto;"></ul>
      </div>

      <div class="glass-card" style="margin-top: 10px;">
        <h3 style="margin-bottom: 8px;">🙋‍♀️ 会議後アンケート (1分)</h3>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn btn-secondary" style="flex:1" onclick="openSurveyModal()">開く</button>
          <button class="btn btn-secondary" style="flex:1" onclick="openQRModal()">QRで共有</button>
        </div>
      </div>
    </div>
  </div>

  <!-- COMMENT MODAL -->
  <div id="commentModal" class="modal">
    <div class="glass-card" style="width: 100%; max-width: 420px;">
      <h3 style="margin-bottom: 15px;">コメント</h3>
      <textarea id="commentInput" rows="4" placeholder="意見や感想を自由にどうぞ"></textarea>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn btn-secondary" onclick="closeCommentModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="submitComment()">送信</button>
      </div>
    </div>
  </div>

  <!-- QR MODAL -->
  <div id="qrModal" class="modal">
    <div class="glass-card" style="width: 100%; max-width: 420px; text-align:center;">
      <h3 style="margin-bottom: 10px;">参加用QR</h3>
      <canvas id="qrCanvas" style="background:white; padding:10px; border-radius:12px; margin: 10px auto;"></canvas>
      <div style="word-break: break-all; font-size:0.85rem; opacity:0.8;" id="shareLink"></div>
      <div style="display:flex; gap:10px; margin-top:15px;">
        <button class="btn btn-secondary" onclick="closeQRModal()">閉じる</button>
        <button class="btn btn-primary" onclick="copyShareLink()">リンクをコピー</button>
      </div>
    </div>
  </div>

  <!-- SURVEY MODAL -->
  <div id="surveyModal" class="modal">
    <div class="glass-card" style="width: 100%; max-width: 480px;">
      <h3 style="margin-bottom: 10px;">会議後アンケート</h3>
      <div class="input-group">
        <label>満足度 (1-5)</label>
        <input type="range" id="surveySatisfaction" min="1" max="5" value="4" oninput="document.getElementById('satValue').innerText=this.value;">
        <div id="satValue" style="text-align:right;">4</div>
      </div>
      <div class="input-group">
        <label>役割</label>
        <select id="surveyRole">
          <option value="participant">参加者</option>
          <option value="facilitator">ファシリ</option>
          <option value="executive">経営層</option>
        </select>
      </div>
      <div class="input-group">
        <label>良かった点</label>
        <textarea id="surveyPositive" rows="2"></textarea>
      </div>
      <div class="input-group">
        <label>改善点</label>
        <textarea id="surveyImprovement" rows="2"></textarea>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary" onclick="closeSurveyModal()">閉じる</button>
        <button class="btn btn-primary" onclick="submitSurvey()">送信</button>
      </div>
    </div>
  </div>

  <script>
    let sessionId = null;
    let nickname = null;
    let language = 'ja';
    let targetLanguage = 'en';
    let role = '';
    let department = '';
    let qr;

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const savedSession = params.get('sessionId') || localStorage.getItem('moodflow_sessionId');
      const savedNick = localStorage.getItem('moodflow_nickname');
      language = localStorage.getItem('moodflow_language') || (navigator.language.startsWith('ja') ? 'ja' : 'en');
      targetLanguage = localStorage.getItem('moodflow_targetLanguage') || 'en';
      role = localStorage.getItem('moodflow_role') || '';
      department = localStorage.getItem('moodflow_department') || '';

      document.getElementById('languageSelect').value = language;
      document.getElementById('targetLanguageSelect').value = targetLanguage;
      if (role) document.getElementById('roleSelect').value = role;
      if (department) document.getElementById('deptInput').value = department;

      if (savedSession) document.getElementById('sessionInput').value = savedSession;
      if (savedNick) document.getElementById('nicknameInput').value = savedNick;

      if (savedSession && savedNick) {
        sessionId = savedSession;
        nickname = savedNick;
        document.getElementById('displayNickname').textContent = nickname;
        switchScreen('mainScreen');
        refreshQuestions();
      }
    };

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function joinSession() {
      const sVal = document.getElementById('sessionInput').value.trim();
      const nVal = document.getElementById('nicknameInput').value.trim();
      language = document.getElementById('languageSelect').value;
      targetLanguage = document.getElementById('targetLanguageSelect').value;
      role = document.getElementById('roleSelect').value;
      department = document.getElementById('deptInput').value.trim();

      if (!sVal || !nVal) {
        alert("セッションIDとニックネームを入力してください");
        return;
      }

      sessionId = sVal;
      nickname = nVal;
      localStorage.setItem('moodflow_sessionId', sessionId);
      localStorage.setItem('moodflow_nickname', nickname);
      localStorage.setItem('moodflow_language', language);
      localStorage.setItem('moodflow_targetLanguage', targetLanguage);
      localStorage.setItem('moodflow_role', role);
      localStorage.setItem('moodflow_department', department);

      document.getElementById('displayNickname').textContent = nickname;
      switchScreen('mainScreen');
      refreshQuestions();
    }

    function leaveSession() {
      localStorage.removeItem('moodflow_sessionId');
      localStorage.removeItem('moodflow_nickname');
      sessionId = null;
      nickname = null;
      role = '';
      department = '';
      switchScreen('joinScreen');
    }

    function handleReaction(e, emoji, score) {
      createExplosion(e.clientX, e.clientY, emoji);
      sendMood(emoji, score, "");
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function createExplosion(x, y, emoji) {
      const layer = document.getElementById('animationLayer');
      const el = document.createElement('div');
      el.innerText = emoji;
      el.className = 'animating-emoji';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      layer.appendChild(el);
      setTimeout(() => el.remove(), 1000);
    }

    function openCommentModal() {
      document.getElementById('commentModal').classList.add('active');
      setTimeout(() => document.getElementById('commentInput').focus(), 100);
    }

    function closeCommentModal() {
      document.getElementById('commentModal').classList.remove('active');
    }

    function submitComment() {
      const text = document.getElementById('commentInput').value.trim();
      if (text) {
        sendMood('💬', 0, text);
        document.getElementById('commentInput').value = '';
        closeCommentModal();
        showToast("コメントを送信しました");
      } else {
        closeCommentModal();
      }
    }

    function openQRModal() {
      const modal = document.getElementById('qrModal');
      const link = `${window.location.origin}?sessionId=${encodeURIComponent(sessionId || document.getElementById('sessionInput').value || '')}`;
      document.getElementById('shareLink').textContent = link;

      if (!qr) {
        qr = new QRious({ element: document.getElementById('qrCanvas'), size: 220, value: link });
      } else {
        qr.set({ value: link });
      }
      modal.classList.add('active');
    }

    function closeQRModal() {
      document.getElementById('qrModal').classList.remove('active');
    }

    async function copyShareLink() {
      const text = document.getElementById('shareLink').textContent;
      try {
        await navigator.clipboard.writeText(text);
        showToast('リンクをコピーしました');
      } catch (e) {
        alert(text);
      }
    }

    function openSurveyModal() {
      if (!sessionId) {
        alert('先にセッションへ参加してください');
        return;
      }
      document.getElementById('surveyModal').classList.add('active');
    }

    function closeSurveyModal() {
      document.getElementById('surveyModal').classList.remove('active');
    }

    async function submitSurvey() {
      try {
        const body = {
          sessionId,
          nickname,
          role: document.getElementById('surveyRole').value,
          satisfaction: Number(document.getElementById('surveySatisfaction').value),
          positive: document.getElementById('surveyPositive').value,
          improvement: document.getElementById('surveyImprovement').value
        };
        await fetch('/api/submit-survey', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        showToast('アンケートを送信しました');
        closeSurveyModal();
      } catch (e) {
        console.error(e);
        alert('送信に失敗しました');
      }
    }

    async function submitNote() {
      const text = document.getElementById('noteInput').value.trim();
      if (!sessionId) {
        alert('先にセッションへ参加してください');
        return;
      }
      if (!text) return;
      try {
        await fetch('/api/submit-transcript', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, text, speaker: nickname || 'Note' })
        });
        document.getElementById('noteInput').value = '';
        showToast('メモを保存しました');
      } catch (e) {
        console.error('Note submit failed', e);
      }
    }

    async function sendMood(emoji, score, comment) {
      try {
        await fetch('/api/submit-mood', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            nickname,
            moodScore: score,
            emoticon: emoji,
            comment: comment,
            language,
            targetLanguage,
            role,
            department
          })
        });
      } catch (e) {
        console.error("Send failed", e);
      }
    }

    async function submitQuestion() {
      if (!sessionId) {
        alert('先にセッションへ参加してください');
        return;
      }
      const text = document.getElementById('questionInput').value.trim();
      if (!text) return;
      try {
        await fetch('/api/questions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, nickname, text })
        });
        document.getElementById('questionInput').value = '';
        refreshQuestions();
        showToast('質問を送信しました');
      } catch (e) {
        console.error(e);
      }
    }

    async function refreshQuestions() {
      if (!sessionId) return;
      try {
        const res = await fetch(`/api/questions?sessionId=${sessionId}`);
        const data = await res.json();
        if (data.success) {
          const list = data.questions || [];
          document.getElementById('questionList').innerHTML = list
            .map(q => `<li>${q.text} <span style="opacity:0.7;">(👍${q.voteCount})</span></li>`)
            .join('');
        }
      } catch (e) {
        console.error(e);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('statusMessage');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }
  </script>
</body>

</html>
