<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MoodFlow</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
      overflow-x: hidden;
      padding-bottom: env(safe-area-inset-bottom);
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    .container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      position: relative;
      z-index: 2;
    }

    /* Welcome & Join Screen */
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .screen.active {
      display: flex;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 1rem;
      font-weight: 700;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      color: white;
      font-size: 1.1rem;
      transition: all 0.3s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: white;
      background: rgba(0, 0, 0, 0.4);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    .btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 50px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: white;
      color: #333;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    /* Main Reaction Design */
    .reaction-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
    }

    .reaction-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .reaction-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(5px);
      font-size: 3rem;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .reaction-btn:active {
      transform: scale(0.9);
      background: rgba(255, 255, 255, 0.4);
    }

    .comment-trigger {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: underline;
      cursor: pointer;
      padding: 10px;
    }

    /* Modal for Comment */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 100;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal.active {
      display: flex;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Animation Layer */
    .animation-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 50;
      overflow: hidden;
    }

    .animating-emoji {
      position: absolute;
      font-size: 4rem;
      transform-origin: center;
      animation: explode 1s ease-out forwards;
      opacity: 0.8;
    }

    @keyframes explode {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.8;
      }

      100% {
        transform: translate(-50%, -50%) scale(15);
        opacity: 0;
      }
    }

    .participant-label {
      text-align: center;
      padding: 10px;
      font-size: 1rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    #statusMessage {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      padding: 10px 20px;
      border-radius: 30px;
      z-index: 200;
      display: none;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <!-- Background Animation Layer -->
  <div class="animation-layer" id="animationLayer"></div>

  <!-- Status Toast -->
  <div id="statusMessage">送信しました</div>

  <div class="container">

    <!-- JOIN SCREEN -->
    <div id="joinScreen" class="screen active">
      <div style="flex: 1; display: flex; flex-direction: column; justify-content: center;">
        <h1>MoodFlow</h1>
        <p style="text-align: center; margin-bottom: 20px; opacity: 0.9;">会議のムードをリアルタイムで共有</p>

        <div
          style="display: flex; gap: 10px; justify-content: center; margin-bottom: 30px; font-size: 0.9rem; position: relative; z-index: 10;">
          <a href="admin.html" style="color: white; opacity: 0.7; padding: 10px;">🔐 管理者</a>
        </div>

        <div class="glass-card">
          <div class="input-group">
            <label>セッションID</label>
            <input type="text" id="sessionInput" placeholder="meeting-001">
          </div>
          <div class="input-group">
            <label>ニックネーム</label>
            <input type="text" id="nicknameInput" placeholder="例: ペンギン">
          </div>
          <button class="btn btn-primary" onclick="joinSession()">参加する</button>
        </div>
      </div>
    </div>

    <!-- MAIN SCREEN -->
    <div id="mainScreen" class="screen">
      <div class="participant-label">
        <span id="displayNickname">ゲスト</span> として参加中
        <button onclick="leaveSession()"
          style="margin-left: 10px; padding: 5px 10px; background: rgba(255,255,255,0.2); border: none; border-radius: 4px; color: white; cursor: pointer; font-size: 0.8rem;">退出</button>
      </div>

      <div class="reaction-zone">
        <h2 style="font-weight: 300; opacity: 0.9;">今の気分は？</h2>

        <div class="reaction-buttons">
          <button class="reaction-btn" onclick="handleReaction(event, '😢', -5)">😢</button>
          <button class="reaction-btn" onclick="handleReaction(event, '😐', 0)">😐</button>
          <button class="reaction-btn" onclick="handleReaction(event, '😊', 5)">😊</button>
        </div>

        <div class="comment-trigger" onclick="openCommentModal()">
          💬 コメントを書く
        </div>
      </div>
    </div>

  </div>

  <!-- COMMENT MODAL -->
  <div id="commentModal" class="modal">
    <div class="glass-card" style="width: 100%; max-width: 400px;">
      <h3 style="margin-bottom: 15px;">コメント</h3>
      <textarea id="commentInput" rows="4" placeholder="意見や感想を入力..."></textarea>
      <div style="display: flex; gap: 10px; margin-top: 15px;">
        <button class="btn" style="background: rgba(255,255,255,0.2); color: white;"
          onclick="closeCommentModal()">キャンセル</button>
        <button class="btn btn-primary" onclick="submitComment()">送信</button>
      </div>
    </div>
  </div>

  <script>
    let sessionId = null;
    let nickname = null;

    // --- INIT ---
    window.onload = function () {
      const savedSession = localStorage.getItem('moodflow_sessionId');
      const savedNick = localStorage.getItem('moodflow_nickname');
      if (savedSession && savedNick) {
        sessionId = savedSession;
        nickname = savedNick;
        document.getElementById('displayNickname').textContent = nickname;
        switchScreen('mainScreen');
      }
    };

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // --- ACTIONS ---
    function joinSession() {
      const sVal = document.getElementById('sessionInput').value.trim();
      const nVal = document.getElementById('nicknameInput').value.trim();

      if (!sVal || !nVal) {
        alert("セッションIDとニックネームを入力してください");
        return;
      }

      sessionId = sVal;
      nickname = nVal;
      localStorage.setItem('moodflow_sessionId', sessionId);
      localStorage.setItem('moodflow_nickname', nickname);

      document.getElementById('displayNickname').textContent = nickname;
      switchScreen('mainScreen');
    }

    function leaveSession() {
      localStorage.removeItem('moodflow_sessionId');
      localStorage.removeItem('moodflow_nickname');
      sessionId = null;
      nickname = null;
      switchScreen('joinScreen');
    }

    function handleReaction(e, emoji, score) {
      // 1. Trigger Animation
      createExplosion(e.clientX, e.clientY, emoji);

      // 2. Send Data
      sendData(emoji, score, "");

      // 3. Feedback Haptic/Sound (Optional)
      if (navigator.vibrate) navigator.vibrate(50);
    }

    function createExplosion(x, y, emoji) {
      const layer = document.getElementById('animationLayer');
      const el = document.createElement('div');
      el.innerText = emoji;
      el.className = 'animating-emoji';
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      layer.appendChild(el);

      // Remove after animation
      setTimeout(() => {
        el.remove();
      }, 1000);
    }

    // --- COMMENT MODAL ---
    function openCommentModal() {
      document.getElementById('commentModal').classList.add('active');
      setTimeout(() => document.getElementById('commentInput').focus(), 100);
    }

    function closeCommentModal() {
      document.getElementById('commentModal').classList.remove('active');
    }

    function submitComment() {
      const text = document.getElementById('commentInput').value.trim();
      if (text) {
        sendData('💬', 0, text); // Comment is neutral mood usually, or 0
        document.getElementById('commentInput').value = '';
        closeCommentModal();
        showToast("コメントを送信しました");
      } else {
        closeCommentModal();
      }
    }

    // --- API ---
    async function sendData(emoji, score, comment) {
      try {
        await fetch('/api/submit-mood', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            nickname,
            moodScore: score,
            emoticon: emoji,
            comment: comment
          })
        });
        // Success silent for rapid tapping
      } catch (e) {
        console.error("Send failed", e);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('statusMessage');
      t.textContent = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 2000);
    }
  </script>
</body>

</html>
