<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>補佐やねん 管理画面</title>
  <script src="/checkAuth.js"></script>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background: #f8f9fa;
      color: #333;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid #dee2e6;
    }

    h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 500;
      color: #212529;
    }

    .card {
      background: white;
      border: 1px solid #dee2e6;
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 18px;
      margin-bottom: 15px;
      color: #495057;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 4px;
      font-size: 14px;
    }

    button,
    .btn {
      padding: 10px 16px;
      border-radius: 4px;
      border: 1px solid transparent;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      text-align: center;
    }

    .btn-primary {
      background-color: #007bff;
      color: white;
      border-color: #007bff;
    }

    .btn-primary:hover {
      background-color: #0069d9;
    }

    .btn-danger {
      background-color: #dc3545;
      color: white;
      border-color: #dc3545;
    }

    .btn-danger:hover {
      background-color: #c82333;
    }

    .btn-secondary {
      background-color: #6c757d;
      color: white;
      border-color: #6c757d;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
    }

    .btn-outline {
      background-color: white;
      color: #007bff;
      border-color: #007bff;
    }

    .btn-outline:hover {
      background-color: #f8f9fa;
    }

    .session-item {
      padding: 15px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-item:last-child {
      border-bottom: none;
    }

    .session-info h3 {
      margin: 0 0 5px;
      font-size: 16px;
    }

    .session-meta {
      font-size: 12px;
      color: #6c757d;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .logout {
      font-size: 14px;
      color: #6c757d;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 4px;
      max-width: 800px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1>補佐やねん 管理画面</h1>
      <div>
        <span id="userName" style="margin-right: 15px; font-weight: bold;"></span>
        <span class="logout" onclick="logout()">ログアウト</span>
      </div>
    </header>

    <!-- Create Session -->
    <div class="card">
      <h2>新規セッション</h2>
      <div class="input-group">
        <input type="text" id="newSessionName" placeholder="セッション名を入力">
        <button class="btn btn-primary" onclick="createSession()">作成</button>
      </div>
    </div>

    <!-- Session List -->
    <div class="card">
      <h2>セッション一覧</h2>
      <div id="sessionList">
        <p style="text-align: center; color: #6c757d;">読み込み中...</p>
      </div>
    </div>
  </div>

  <!-- Analysis Modal -->
  <div id="analysisModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <h2 style="margin:0;">分析レポート</h2>
        <span onclick="document.getElementById('analysisModal').style.display='none'"
          style="cursor:pointer; font-size:20px;">&times;</span>
      </div>
      <div id="analysisContent"></div>
    </div>
  </div>

  <script>
    const userStr = localStorage.getItem('moodflow_user');
    const user = userStr ? JSON.parse(userStr) : null;

    if (user) {
      document.getElementById('userName').textContent = user.name || user.email;
      loadSessions();
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/my-sessions', {
          headers: { 'x-user-id': user.id }
        });
        const data = await res.json();
        const list = document.getElementById('sessionList');

        if (data.success && data.sessions.length > 0) {
          list.innerHTML = data.sessions.map(s => {
            const isEnded = s.isActive === false;
            let actionArea = '';

            if (!isEnded) {
              actionArea = `<button onclick="endSession('${s.id}')" class="btn btn-danger">終了</button>`;
            } else {
              const surveyCount = s._count ? s._count.surveyResponses : 0;
              actionArea = `
                 <div style="text-align:right;">
                   <div style="font-size:12px; margin-bottom:4px;">回答数: ${surveyCount}</div>
                   <button onclick="analyzeSession('${s.id}')" class="btn btn-outline">分析</button>
                 </div>
               `;
            }

            return `
              <div class="session-item">
                <div class="session-info">
                  <h3>${escapeHtml(s.name)}</h3>
                  <div class="session-meta">作成日: ${new Date(s.createdAt).toLocaleDateString()} ${new Date(s.createdAt).toLocaleTimeString()}</div>
                </div>
                <div class="actions">
                  <a href="presenter.html?sessionId=${s.id}" class="btn btn-secondary" target="_blank">発表者</a>
                  <a href="dashboard.html?sessionId=${s.id}" class="btn btn-secondary" target="_blank">ダッシュボード</a>
                  ${actionArea}
                </div>
              </div>
            `;
          }).join('');
        } else {
          list.innerHTML = '<p style="text-align: center; color: #6c757d;">セッションがありません</p>';
        }
      } catch (e) {
        console.error(e);
        document.getElementById('sessionList').innerHTML = '<p style="color: red;">エラーが発生しました</p>';
      }
    }

    async function endSession(sessionId) {
      if (!confirm('セッションを終了しますか？')) return;
      try {
        await fetch(`/api/session?sessionId=${sessionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'end' })
        });
        loadSessions();
      } catch (e) { alert("エラーが発生しました"); }
    }

    async function createSession() {
      const nameInput = document.getElementById('newSessionName');
      const name = nameInput.value.trim();
      if (!name) return;
      try {
        const res = await fetch('/api/my-sessions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-user-id': user.id },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          nameInput.value = '';
          loadSessions();
        } else { alert('作成失敗: ' + data.error); }
      } catch (e) { alert('エラーが発生しました'); }
    }

    function logout() {
      localStorage.removeItem('moodflow_user');
      window.location.href = 'login.html?redirect=admin.html';
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    async function analyzeSession(sessionId) {
      const modal = document.getElementById('analysisModal');
      const content = document.getElementById('analysisContent');
      modal.style.display = 'flex';
      content.innerHTML = '<p style="text-align:center;">分析中...</p>';

      try {
        const res = await fetch('/api/analyze-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
        const data = await res.json();

        if (data.success) {
          const r = data.data.analysis;
          const stats = data.data.stats;
          content.innerHTML = `
                <div style="background:#f8f9fa; padding:15px; margin-bottom:20px; border-radius:4px;">
                    <h3 style="margin-top:0;">統計</h3>
                    <p>参加: ${stats.participants}名 / 発言: ${stats.total}件 / 平均スコア: ${stats.average.toFixed(2)}</p>
                </div>
                <h3>全体ムード</h3>
                <p>${r.overallMood}</p>
                
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                    <div>
                        <h4 style="color:#28a745;">良かった点</h4>
                        <ul>${r.positiveHighlights.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                    <div>
                        <h4 style="color:#dc3545;">懸念点</h4>
                        <ul>${r.concerns.map(i => `<li>${i}</li>`).join('')}</ul>
                    </div>
                </div>

                <h3>インサイト</h3>
                <ul>${r.keyInsights.map(i => `<li>${i}</li>`).join('')}</ul>

                <h3>改善提案</h3>
                <ul>${r.recommendations.map(i => `<li>${i}</li>`).join('')}</ul>
            `;
        } else {
          content.innerHTML = `<p style="color:red;">エラー: ${data.error}</p>`;
        }
      } catch (e) {
        content.innerHTML = `<p style="color:red;">通信エラー</p>`;
      }
    }
  </script>
</body>

</html>
