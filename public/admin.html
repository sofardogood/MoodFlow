<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MoodFlow - 管理画面</title>
  <script src="/checkAuth.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      margin: 0;
      padding: 0;
      color: #333;
    }

    .container {
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    h1 {
      margin: 0;
      color: #667eea;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
      margin-bottom: 24px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      text-decoration: none;
      display: inline-block;
      transition: background 0.2s;
    }

    .btn-primary {
      background: #667eea;
      color: white;
    }

    .btn-secondary {
      background: #cbd5e0;
      color: #4a5568;
    }

    .btn-outline {
      border: 1px solid #667eea;
      color: #667eea;
      background: transparent;
    }

    .input-group {
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      padding: 15px;
      /* Larger padding */
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      flex: 1;
      font-size: 1.1rem;
      /* Larger font */
    }

    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #edf2f7;
    }

    .session-item:last-child {
      border-bottom: none;
    }

    .session-info h3 {
      margin: 0 0 5px 0;
      font-size: 1.1rem;
    }

    .session-meta {
      font-size: 0.85rem;
      color: #718096;
    }

    .actions {
      display: flex;
      gap: 8px;
      white-space: nowrap;
      /* Prevent wrapping */
    }

    .actions a {
      font-size: 0.9rem;
      padding: 6px 12px;
    }

    .logout {
      color: #e53e3e;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <header>
      <h1>MoodFlow 管理画面</h1>
      <div>
        <span id="userName" style="margin-right: 15px; font-weight: bold;"></span>
        <span class="logout" onclick="logout()">ログアウト</span>
      </div>
    </header>

    <!-- Create Session -->
    <div class="card">
      <h2>新規セッション作成</h2>
      <div class="input-group">
        <input type="text" id="newSessionName" placeholder="セッション名 (例: 定例会議 12/10)">
        <button class="btn btn-primary" onclick="createSession()">作成</button>
      </div>
    </div>

    <!-- Session List -->
    <div class="card">
      <h2>あなたのセッション</h2>
      <div id="sessionList">
        <p style="text-align: center; color: #a0aec0;">読み込み中...</p>
      </div>
    </div>
  </div>

  <script>
    // Get user from localStorage (set by login.html)
    const userStr = localStorage.getItem('moodflow_user');
    const user = userStr ? JSON.parse(userStr) : null;

    if (user) {
      document.getElementById('userName').textContent = user.name || user.email;
      loadSessions();
    }

    async function loadSessions() {
      try {
        const res = await fetch('/api/my-sessions', {
          headers: { 'x-user-id': user.id }
        });
        const data = await res.json();

        const list = document.getElementById('sessionList');
        if (data.success && data.sessions.length > 0) {
          list.innerHTML = data.sessions.map(s => {
            const isEnded = s.isActive === false;
            let actionArea = '';
            if (!isEnded) {
              // Active: Show End button
              actionArea = `<button onclick="endSession('${s.id}')" class="btn btn-primary" style="background:#e53e3e; font-size:0.9rem;">📋 終了してアンケート分析</button>`;
            } else {
              // Ended: Show Analyze button + Survey count
              const surveyCount = s._count ? s._count.surveyResponses : 0;
              actionArea = `
                    <div style="display:flex; flex-direction:column; align-items:end; gap:5px;">
                        <span style="font-size:0.85rem; color:#4a5568;">アンケート回答: <strong>${surveyCount}</strong>件</span>
                        <button onclick="analyzeSession('${s.id}')" class="btn btn-outline" style="border-color: #ed8936; color: #ed8936; font-size:0.9rem;">📝 分析を実行</button>
                    </div>
                `;
            }

            return `
          <div class="session-item">
            <div class="session-info">
              <h3>${escapeHtml(s.name)}</h3>
              <div class="session-meta">Created: ${new Date(s.createdAt).toLocaleString()} | ID: ${s.id}</div>
            </div>
            <div class="actions" style="align-items:center;">
              <a href="presenter.html?sessionId=${s.id}" class="btn btn-primary" target="_blank">🎤 プレゼンター</a>
              <a href="dashboard.html?sessionId=${s.id}" class="btn btn-outline" target="_blank">📊 ダッシュボード</a>
              ${actionArea}
            </div>
          </div>
        `}).join('');
        } else {
          list.innerHTML = '<p style="text-align: center; color: #a0aec0;">まだセッションがありません</p>';
        }
      } catch (e) {
        console.error(e);
        document.getElementById('sessionList').innerHTML = '<p style="color: red;">読み込みエラーが発生しました</p>';
      }
    }

    async function endSession(sessionId) {
      if (!confirm('セッションを終了しますか？\n参加者はアンケート画面へ移動します。')) return;
      try {
        await fetch(`/api/session?sessionId=${sessionId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'end' })
        });
        loadSessions(); // Reload to update UI
      } catch (e) { alert("エラーが発生しました"); }
    }

    async function createSession() {
      const nameInput = document.getElementById('newSessionName');
      const name = nameInput.value.trim();
      if (!name) return;

      try {
        const res = await fetch('/api/my-sessions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-user-id': user.id
          },
          body: JSON.stringify({ name })
        });
        const data = await res.json();
        if (data.success) {
          nameInput.value = '';
          loadSessions();
        } else {
          alert('作成失敗: ' + data.error);
        }
      } catch (e) {
        alert('エラーが発生しました');
      }
    }

    function logout() {
      localStorage.removeItem('moodflow_user');
      window.location.href = 'login.html?redirect=admin.html';
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
  <!-- Analysis Modal -->
  <div id="analysisModal"
    style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:100; justify-content:center; align-items:center; padding:20px;">
    <div
      style="background:white; width:100%; max-width:800px; max-height:90vh; overflow-y:auto; border-radius:12px; padding:30px;">
      <h2 style="margin-top:0; color:#667eea; display:flex; justify-content:space-between; align-items:center;">
        会議分析レポート
        <span onclick="document.getElementById('analysisModal').style.display='none'"
          style="cursor:pointer; color:#999; font-size:1.5rem;">&times;</span>
      </h2>
      <div id="analysisContent">
        <p style="text-align:center; color:#666;">分析中... (数秒かかります)</p>
      </div>
    </div>
  </div>

  <script>
    // ... existing script ...

    async function analyzeSession(sessionId) {
      const modal = document.getElementById('analysisModal');
      const content = document.getElementById('analysisContent');
      modal.style.display = 'flex';
      content.innerHTML = '<p style="text-align:center; color:#666;">AIが会議データを分析しています...<br>しばらくお待ちください。</p>';

      try {
        // Just analyze (no end session here)
        const res = await fetch('/api/analyze-session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId })
        });
        const data = await res.json();

        if (data.success) {
          const r = data.data.analysis;
          const stats = data.data.stats;
          content.innerHTML = `
                    <div style="margin-bottom:20px; padding:15px; background:#f0f4ff; border-radius:8px;">
                        <h3 style="margin:0 0 10px 0; color:#4c51bf;">📊 統計サマリー</h3>
                        <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap:10px;">
                            <div>参加者: <strong>${stats.participants}名</strong></div>
                            <div>発言数: <strong>${stats.total}件</strong></div>
                            <div>平均スコア: <strong>${stats.average.toFixed(2)}</strong></div>
                            <div>ポジティブ率: <strong>${stats.positiveRate.toFixed(0)}%</strong></div>
                        </div>
                    </div>

                    <div style="margin-bottom:20px;">
                        <h3 style="color:#2d3748;">📝 全体ムード</h3>
                        <p style="font-size:1.1rem; line-height:1.6;">${r.overallMood}</p>
                    </div>

                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px; margin-bottom:20px;">
                        <div style="background:#f0fff4; padding:15px; border-radius:8px;">
                            <h4 style="margin:0 0 10px 0; color:#2f855a;">👍 Good Points</h4>
                            <ul style="margin:0; padding-left:20px;">
                                ${r.positiveHighlights.map(i => `<li>${i}</li>`).join('')}
                            </ul>
                        </div>
                        <div style="background:#fff5f5; padding:15px; border-radius:8px;">
                            <h4 style="margin:0 0 10px 0; color:#c53030;">⚠️ Concerns</h4>
                            <ul style="margin:0; padding-left:20px;">
                                ${r.concerns.map(i => `<li>${i}</li>`).join('')}
                            </ul>
                        </div>
                    </div>

                    <div style="margin-bottom:20px;">
                        <h3 style="color:#2d3748;">💡 Key Insights</h3>
                        <ul style="line-height:1.6;">
                            ${r.keyInsights.map(i => `<li>${i}</li>`).join('')}
                        </ul>
                    </div>

                    <div style="background:#ebf8ff; padding:20px; border-radius:8px;">
                        <h3 style="margin:0 0 10px 0; color:#2b6cb0;">🚀 Recommendations</h3>
                        <ul style="margin:0; padding-left:20px; line-height:1.6;">
                            ${r.recommendations.map(i => `<li><strong>${i}</strong></li>`).join('')}
                        </ul>
                    </div>
                `;
        } else {
          content.innerHTML = `<p style="color:red; text-align:center;">エラー: ${data.error}</p>`;
        }
      } catch (e) {
        content.innerHTML = `<p style="color:red; text-align:center;">通信エラーが発生しました</p>`;
      }
    }
  </script>
</body>

</html>
